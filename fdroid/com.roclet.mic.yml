AutoName: Roclet
Summary: Wireless microphone and speaker for Roc Toolkit
Description: |-
  Roclet turns an Android phone into a wireless microphone for a Roc Toolkit
  receiver, or a wireless speaker for a Roc sender such as the PipeWire ROC
  module. In Microphone mode it captures the phone's microphone and streams it
  over the local Wi-Fi network using Roc's reliable, low-latency audio
  transport. In Speaker mode it receives a stream from a PC and plays it through
  the phone.

  Audio uses Roc's standard rtp+rs8m (source) and rs8m (repair) profiles. In
  Microphone mode the destination IP address and ports are configurable and
  remembered between launches. Speaker mode listens on configurable local ports
  and shows the phone's Wi-Fi address for the sender.

  Both modes run in a foreground service so they continue with the screen off.
  The app contains no analytics, advertising, or telemetry and stores only
  address and port settings locally on the device.

