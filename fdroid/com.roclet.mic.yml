    ndk: 21.1.6352462

MaintainerNotes: |-
  Builds.commit pins the exact full v0.2.0 release commit,
  fbc28be959368d7fd51fd07f165e37a3932a6372. Roclet 0.2.0 adds PC-to-phone
  speaker playback and supersedes 0.1.1 for F-Droid.

  Native dependency: roc-android is built from source, not the upstream prebuilt
  AAR. scripts/native/build-native.sh uses the pinned sources under
  scripts/native/vendor/ and patches under scripts/native/patches/, verifies
  every hash, and stages jniLibs and headers for the ':roc-android' Gradle
  module. It needs scons (4.x), ragel 6.10, GNU make/build-essential, cmake,
  ninja, and the NDK above. The buildserver installs these via the 'sudo' step.

  Local native and unsigned Gradle release builds pass; the isolated production
  buildserver environment has not been verified.

  OpenFEC is predominantly licensed under CeCILL-C and its patched source is
  built into libroc.so. The app's bundled third-party notices contain the
  CeCILL-C text, upstream notices, and Roclet's modification notices for the
  normal F-Droid licence review.

  Release signing: app/build.gradle attaches the release signing config only when
  a signing-properties file is present, so an unsigned release builds and
  produces app-release-unsigned.apk for F-Droid to sign.

